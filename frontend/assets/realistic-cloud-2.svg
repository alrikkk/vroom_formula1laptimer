<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200">
  <defs>
    <filter id="cloudBlur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="sunlitCore2" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="85%" stop-color="#e0f2fe" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientBody2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80" />
      <stop offset="65%" stop-color="#f0f9ff" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="crestHighlight2" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#cloudBlur2)">
    <!-- Base elongated body -->
    <ellipse cx="270" cy="125" rx="190" ry="48" fill="url(#ambientBody2)" />
    <ellipse cx="180" cy="120" rx="120" ry="44" fill="url(#ambientBody2)" />
    <ellipse cx="360" cy="120" rx="130" ry="44" fill="url(#ambientBody2)" />

    <!-- Organic lobes -->
    <ellipse cx="260" cy="95" rx="85" ry="58" fill="url(#sunlitCore2)" />
    <ellipse cx="195" cy="102" rx="72" ry="50" fill="url(#sunlitCore2)" />
    <ellipse cx="335" cy="100" rx="78" ry="52" fill="url(#sunlitCore2)" />
    <ellipse cx="130" cy="118" rx="60" ry="40" fill="url(#sunlitCore2)" />
    <ellipse cx="405" cy="115" rx="65" ry="40" fill="url(#sunlitCore2)" />
    <ellipse cx="85" cy="130" rx="45" ry="28" fill="url(#sunlitCore2)" />
    <ellipse cx="455" cy="128" rx="50" ry="28" fill="url(#sunlitCore2)" />

    <!-- Highlights -->
    <ellipse cx="260" cy="80" rx="65" ry="36" fill="url(#crestHighlight2)" />
    <ellipse cx="335" cy="86" rx="58" ry="32" fill="url(#crestHighlight2)" />
  </g>
</svg>
