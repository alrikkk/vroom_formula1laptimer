<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <defs>
    <filter id="cloudBlur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="sunlitCore3" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#e0f2fe" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientBody3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#f0f9ff" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="crestHighlight3" cx="50%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#cloudBlur3)">
    <!-- Base wide bank -->
    <ellipse cx="340" cy="140" rx="260" ry="50" fill="url(#ambientBody3)" />
    <ellipse cx="230" cy="135" rx="160" ry="46" fill="url(#ambientBody3)" />
    <ellipse cx="460" cy="135" rx="170" ry="46" fill="url(#ambientBody3)" />

    <!-- Multiple gentle puffs -->
    <ellipse cx="340" cy="108" rx="100" ry="62" fill="url(#sunlitCore3)" />
    <ellipse cx="255" cy="116" rx="85" ry="54" fill="url(#sunlitCore3)" />
    <ellipse cx="430" cy="114" rx="90" ry="56" fill="url(#sunlitCore3)" />
    <ellipse cx="170" cy="128" rx="70" ry="44" fill="url(#sunlitCore3)" />
    <ellipse cx="515" cy="126" rx="75" ry="44" fill="url(#sunlitCore3)" />
    <ellipse cx="105" cy="142" rx="55" ry="32" fill="url(#sunlitCore3)" />
    <ellipse cx="585" cy="140" rx="60" ry="32" fill="url(#sunlitCore3)" />

    <!-- Sun crest -->
    <ellipse cx="340" cy="92" rx="75" ry="38" fill="url(#crestHighlight3)" />
    <ellipse cx="430" cy="100" rx="68" ry="34" fill="url(#crestHighlight3)" />
    <ellipse cx="255" cy="102" rx="62" ry="32" fill="url(#crestHighlight3)" />
  </g>
</svg>
