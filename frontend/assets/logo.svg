<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="aeroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chromeSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aerodynamic Telemetry Chevron Backdrop -->
  <path d="M 12 12 L 32 12 L 20 54 L 0 54 Z" fill="#0284c7" fill-opacity="0.15" />
  <path d="M 28 12 L 48 12 L 36 54 L 16 54 Z" fill="#0284c7" fill-opacity="0.25" />
  <path d="M 44 12 L 64 12 L 52 54 L 32 54 Z" fill="url(#amberSpeed)" />

  <!-- Speed Winglet Accent Top -->
  <path d="M 68 18 L 220 18 Q 230 18 226 22 L 205 22 Q 200 22 195 22 L 65 22 Z" fill="#38bdf8" />

  <!-- VROOM Wordmark -->
  <text x="68" y="52" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="42" 
        letter-spacing="1.5" 
        fill="url(#chromeSpeed)"
        filter="url(#subtleGlow)">
    VROOM
  </text>

  <!-- Specular Reflection Overlay on VROOM -->
  <text x="68" y="52" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="42" 
        letter-spacing="1.5" 
        fill="url(#glossHighlight)">
    VROOM
  </text>

  <!-- Telemetry Subtitle Tag -->
  <rect x="238" y="38" width="94" height="15" rx="3" fill="#0f172a" fill-opacity="0.85" />
  <text x="242" y="49" 
        font-family="'SF Mono', 'Roboto Mono', Menlo, monospace" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="1.2" 
        fill="#38bdf8">
    TELEMETRY.ML
  </text>

  <!-- Micro Apex Curb Line Bottom -->
  <line x1="68" y1="58" x2="225" y2="58" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="228" y1="58" x2="250" y2="58" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
</svg>
